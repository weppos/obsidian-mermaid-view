---
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.0.0

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Package plugin
        run: |
          zip mermaid-view.zip main.js manifest.json styles.css

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            main.js
            styles.css
            mermaid-view.zip

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css mermaid-view.zip
